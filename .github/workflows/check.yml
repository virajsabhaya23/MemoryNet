name: Checks

# Pull requests are checked once per commit. A push to a feature branch would otherwise
# run the same four-job matrix a second time alongside that pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run eval:smoke
      - run: npm run eval:work
      - run: npm run demo:workspace
      - run: npm run site:check
      - run: npm audit --audit-level=high
      - run: npm --prefix examples/eslint-demo/scenario/start ci --ignore-scripts --no-audit --no-fund
      - run: node examples/eslint-demo/verify.mjs
